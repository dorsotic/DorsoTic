/* ===== меню в верхней панели ===== */
header{flex-wrap:wrap;row-gap:.5rem}
header nav{position:static;left:auto;bottom:auto;transform:none;order:3;flex:1 1 100%;width:100%;max-width:100%;margin:0;padding:.28rem;gap:.25rem;justify-content:space-between;border-radius:18px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}

@media(max-width:600px){header nav{width:100%;padding:.22rem;gap:.15rem;border-radius:16px}header nav button{min-height:3.1rem;padding:.38rem .1rem;font-size:.66rem}header nav button span:first-child{font-size:1.2rem}}
main{padding-bottom:2rem}#app.tw{padding-bottom:6rem}footer{padding-bottom:1.2rem}

.pw .eye:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

/* ===== свои иконки меню ===== */
header nav button .ic{display:block;width:1.6rem;height:1.6rem;object-fit:contain}
@media(max-width:600px){header nav button .ic{width:1.4rem;height:1.4rem}}

/* ===== меню: плитки-иконки, без обрезки текста ===== */
header nav{display:flex;flex-wrap:nowrap;justify-content:flex-start;gap:.3rem;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:.4rem;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,125,26,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.28)}
header nav::-webkit-scrollbar{display:none}
header nav button:first-child{margin-left:auto}header nav button:last-child{margin-right:auto}
header nav button{position:relative;flex:0 0 auto;min-width:4.6rem;min-height:0;padding:.35rem .7rem .55rem;gap:.28rem;border:0;border-radius:18px;background:none;box-shadow:none;color:var(--muted);font-size:.74rem;font-weight:600;line-height:1.1;white-space:nowrap;overflow:visible;scroll-snap-align:center;transition:color .18s,transform .18s}

header nav button.cur::after{content:"";position:absolute;left:50%;bottom:.14rem;width:1.1rem;height:2px;margin-left:-.55rem;border-radius:2px;background:var(--gold)}
header nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
@media(max-width:600px){header nav{padding:.3rem;gap:.15rem;border-radius:20px}header nav button{min-width:4.1rem;padding:.3rem .5rem .5rem;font-size:.68rem}header nav button span:first-child{width:2.1rem;height:2.1rem;font-size:1.05rem;border-radius:12px}header nav button .ic{width:1.45rem;height:1.45rem}}

@media(max-width:600px){header nav button{padding:.35rem .5rem}header nav button span:first-child{width:auto;height:auto}}

/* ===== v4: анимации, помощники со статистикой, новое меню, мобильная версия ===== */
:root{--ease:cubic-bezier(.22,.8,.3,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popOut{to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.96)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
body.lock{overflow:hidden}

/* --- появление страниц и элементов --- */
#app>div>h1{animation:rise .6s var(--ease) backwards}
#app>div>.sub{animation:rise .6s var(--ease) .08s backwards}
#app:not(.wide) :is(.card,.stat,details,.tm,.fs,.rv,.dr){animation:rise .55s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms + 80ms)}
#app:not(.wide) .door{animation:rise .6s var(--ease) backwards;animation-delay:calc(var(--i,0)*60ms + 120ms)}
.tag{animation:pop .32s var(--spring) both}

/* --- нажатие и наведение --- */
button{transition:transform .18s var(--ease),filter .18s,box-shadow .2s,background .2s,color .2s,border-color .2s}
@media(hover:hover){
  :is(.go,.acts>button,.fbtn,.tabs>button,.mdl .acts button,.hext button):hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,125,26,.16)}
  .card:hover{border-color:rgba(255,125,26,.3);transform:translateY(-1px)}
  .stat:hover{transform:translateY(-2px);border-color:rgba(255,125,26,.35)}
  .pk-i:hover{padding-left:.8rem}
  .pick button:hover{transform:scale(1.2)}
}
button:active:not(:disabled){transform:scale(.96)}
.card,.stat{transition:transform .25s var(--ease),border-color .25s,background .25s}
.pk-i{transition:background .15s,color .15s,padding .2s var(--ease)}
.pk-i.on{background:rgba(255,125,26,.1)}
.pick button{transition:transform .2s var(--spring),color .2s}.pick button.on{animation:pop .35s var(--spring)}
.tabs button{transition:background .25s,color .25s,border-color .25s,transform .18s var(--ease)}
.rp{overflow:hidden}
.rpl{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);pointer-events:none;animation:ripple .6s ease-out forwards}
:is(.go,.fbtn,.acts>button:not(.ghost):not(.bad):not(.hold)) .rpl{background:#fff;opacity:.45}

/* --- окна, шторки, уведомления --- */
.bd.out{animation:fadeOut .17s ease forwards}.bd.out .mdl{animation:popOut .17s ease forwards}
.sheet-bd{animation:fadeIn .2s ease both}
.sheet-bd.hs .sheet{animation:sheetIn .38s var(--ease) both}
.sheet-bd.out{animation:fadeOut .2s ease forwards}.sheet-bd.out .sheet{animation:sheetOut .2s ease forwards}
#toasts{position:fixed;left:0;right:0;bottom:calc(1.2rem + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:0 .75rem;pointer-events:none}
#toasts .toast{position:relative;left:auto;bottom:auto;transform:none;animation:toastIn .38s var(--spring) both}
#toasts .toast.out{animation:toastOut .22s ease forwards}

/* --- форма заявки по шагам --- */
.form{padding:.3rem 1.15rem 1.15rem}
.fs{padding:1rem 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.fs-h{display:flex;align-items:center;gap:.6rem;font:1.02rem var(--font);letter-spacing:.03em;color:#ffe2c2}
.fs-h i{flex:none;display:grid;place-items:center;width:1.75rem;height:1.75rem;border-radius:50%;font:700 .8rem Georgia,serif;font-style:normal;color:#1a1305;background:linear-gradient(135deg,#ffc266,#e8721c);box-shadow:0 0 14px rgba(255,125,26,.3)}
.fs-h+*{margin-top:.55rem}.fs label{margin-top:.7rem}.fs-h+label{margin-top:.55rem}
.sk-tile{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:shim 1.2s linear infinite!important;color:transparent}.sk-tile span{color:transparent}
.trk{display:flex;gap:.3rem;margin:.55rem 0 .2rem}
.trk span{flex:1;position:relative;padding-top:.55rem;font-size:.66rem;color:#7c7366;text-align:center}
.trk span:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:9px;background:rgba(255,255,255,.1);transform-origin:left}
.trk span.on{color:var(--text)}.trk span.on:before{background:var(--gold);animation:grow .8s var(--ease) backwards}
.trk.waiting span.on:before{background:var(--hold)}.trk.closed span.on:before{background:var(--ok)}

/* --- инфо --- */
.step{display:flex;gap:.8rem;align-items:flex-start}
.sn{flex:none;display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:50%;font:700 .9rem Georgia,serif;font-style:normal;color:#1a1305;background:linear-gradient(135deg,#ffc266,#e8721c)}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.25rem 0;min-height:2.2rem}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";flex:none;font-size:1.5rem;line-height:1;color:var(--gold);transition:transform .3s var(--spring)}
details{transition:border-color .25s,background .25s}
details[open]{border-color:rgba(255,125,26,.3);background:rgba(255,125,26,.04)}
details[open] summary:after{transform:rotate(45deg)}
details[open] p{animation:rise .35s var(--ease)}

/* --- помощники --- */
#app.v-team{max-width:62rem}

.tm:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.tm.r1 .tmav{box-shadow:0 0 0 2px #ffc266,0 0 24px rgba(242,210,143,.45)}
.tm.r2 .tmav{box-shadow:0 0 0 2px #cfd6df,0 0 18px rgba(207,214,223,.3)}.tm.r2 .rk{background:#cfd6df}
.tm.r3 .tmav{box-shadow:0 0 0 2px #d39a6b,0 0 18px rgba(211,154,107,.3)}.tm.r3 .rk{background:#d39a6b}
.tmi{flex:1;min-width:0}
.tmn{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}.tmn b{font-size:1.06rem;overflow:hidden;text-overflow:ellipsis}
.tmr{margin-top:.15rem;font-size:.84rem}
.chev{flex:none;color:var(--muted);font-size:1.6rem;line-height:1;transition:transform .25s var(--ease),color .2s}
@media(hover:hover){.tm:hover{transform:translateY(-3px);border-color:rgba(255,125,26,.4);box-shadow:0 14px 34px rgba(0,0,0,.35)}.tm:hover .chev{transform:translateX(4px);color:var(--gold)}}
.tm.sk-card{pointer-events:none;cursor:default}
.hhead{display:flex;align-items:center;gap:.9rem;margin-top:.2rem}
.hav{width:4.2rem;height:4.2rem;font-size:1.8rem;box-shadow:0 0 0 4px rgba(255,125,26,.14),0 0 30px rgba(255,125,26,.28)}
.hnm{min-width:0}.hnm h2{margin:0 0 .2rem;font-size:1.5rem;overflow-wrap:anywhere}
.hrate{display:flex;align-items:center;flex-wrap:wrap;gap:.1rem;font-size:1rem}
.stats.hs{grid-template-columns:repeat(3,minmax(0,1fr));margin:.2rem 0}.stats.hs .stat span{font-size:1.6rem}
.hext h2{margin:1rem 0 .5rem}
.dist{display:grid;gap:.45rem}
.dr{display:grid;grid-template-columns:2.3rem 1fr 1.8rem;align-items:center;gap:.5rem;font-size:.82rem;color:var(--muted)}
.dr .bar{margin:0;height:8px}.dr .bar i{width:0;transition:width .9s var(--ease)}
.rv{margin-bottom:.45rem;padding:.7rem .85rem;border:1px solid rgba(255,255,255,.07);border-radius:16px;background:rgba(255,255,255,.03);overflow-wrap:anywhere}
.sheet.hl .go{margin-top:.5rem}

/* --- обновление --- */
.warning-caption.live{color:var(--ok);animation:pulse 1.6s ease-in-out infinite}
.cvbar{height:8px;margin:.7rem 0 .2rem}.cvbar[hidden]{display:none}.cvbar i{transition:width 1s linear}
.soon{text-align:center;padding:2rem 1.2rem}
.chip-link{display:inline-block;margin-top:1rem;padding:.6rem 1.1rem;border:1px solid rgba(255,125,26,.35);border-radius:999px;color:var(--gold);font-size:.85rem;text-decoration:none;transition:background .2s,transform .2s var(--ease)}
.chip-link:hover{background:rgba(255,125,26,.12);transform:translateY(-2px)}

@media(min-width:821px){
  .sheet-bd.hs{align-items:center;padding:1rem}
  .sheet-bd.hs .sheet{width:min(100%,31rem);max-height:88dvh;border-radius:26px;border-bottom:1px solid rgba(255,255,255,.1)}
}


/* --- страницы: общий стиль --- */
.hero{position:relative;margin:.2rem 0 1rem;padding:1.5rem 1.2rem 1.2rem;text-align:center;border:1px solid rgba(255,125,26,.22);border-radius:28px;background:radial-gradient(120% 140% at 50% -20%,rgba(255,125,26,.18),transparent 60%),rgba(24,14,32,.7);box-shadow:0 18px 50px rgba(0,0,0,.35);animation:rise .6s var(--ease) backwards}

.v-home .stats .stat{padding:.8rem .5rem;border-radius:20px;background:linear-gradient(160deg,rgba(255,125,26,.09),rgba(22,14,30,.85))}

.v-info .step{position:relative;margin-bottom:.85rem}

.v-update .stats.cd .stat span{font-size:2.4rem;background:linear-gradient(180deg,#ffd08a,#e8721c);-webkit-background-clip:text;background-clip:text;color:transparent}
.v-update .cv{text-align:center}
.v-login .door{max-width:26rem;margin:1rem auto}
.v-login h1,.v-login .sub{text-align:center}
.v-staff .card{padding:1rem 1.05rem;border-radius:20px}
.v-staff .card>b:first-child{display:block;margin-bottom:.2rem;font-size:1.05rem;color:#f4e6c8}

/* --- ТЕЛЕФОН: страницы --- */
@media(max-width:820px){
  #app{padding:1rem .85rem 2rem}
  h1{font-size:1.9rem}
  .hero{padding:1.2rem .9rem 1rem;border-radius:24px}

/* ===== v5: свежий стиль, темы форума, анимации кнопок ===== */
::selection{background:#ff9b2f;color:#1a0f00}
html{scrollbar-color:#ff9b2f #120a1a}
body:before{background:linear-gradient(180deg,rgba(9,5,14,.78),rgba(7,4,11,.92)),radial-gradient(ellipse at 85% -5%,rgba(255,155,47,.13),transparent 50%),radial-gradient(ellipse at 8% 0%,rgba(120,90,200,.12),transparent 50%)}
body:after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 25% 30%,rgba(255,140,40,.1),transparent 70%),radial-gradient(35% 30% at 78% 70%,rgba(140,90,220,.09),transparent 70%);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) scale(1.08)}}
@keyframes sheen{to{background-position:-220% 0}}
@keyframes glow{0%,100%{box-shadow:0 0 14px rgba(255,125,26,.2)}50%{box-shadow:0 0 28px rgba(255,125,26,.46)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

/* шапка и логотип */
header{background:rgba(12,7,18,.74);border-bottom:1px solid rgba(255,255,255,.07);box-shadow:0 10px 34px rgba(0,0,0,.28)}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,155,47,.75),transparent)}
.logo{display:inline-block;background:linear-gradient(100deg,#ff9b2f 20%,#ffe6bf 45%,#ff9b2f 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(255,125,26,.45));animation:sheen 7s linear infinite;transition:transform .3s var(--spring)}
.logo:hover{transform:scale(1.05)}
h1{color:#ffa23a;text-shadow:0 0 26px rgba(255,125,26,.35)}
h2{color:#ffd6a8}

/* блоки */
.hero{border-color:rgba(255,155,47,.35);background:radial-gradient(120% 140% at 50% -20%,rgba(255,155,47,.2),transparent 60%),rgba(20,11,28,.74);box-shadow:0 18px 50px rgba(0,0,0,.4),0 0 40px rgba(255,125,26,.08)}
.eyebrow{border-color:rgba(255,155,47,.4);background:rgba(255,155,47,.1);color:#ffd9a8}
.door,.mdl,.card,.stat,details{border-color:rgba(255,155,47,.16)}
.door,.mdl{box-shadow:0 18px 50px rgba(0,0,0,.4);transition:border-color .3s,box-shadow .3s}
.card{border-left-color:rgba(255,155,47,.55)}
input:focus,textarea:focus,select:focus{border-color:#ff9b2f;box-shadow:0 0 0 3px rgba(255,125,26,.2)}
.fs-h i,.sn,.av{background:linear-gradient(135deg,#ffc266,#e8721c);color:#2a0f00}
.fs-h i{box-shadow:0 0 14px rgba(255,125,26,.4)}
footer{background:linear-gradient(180deg,rgba(8,4,12,.5),rgba(22,10,6,.6));border-top:1px solid rgba(255,155,47,.2)}
@media(hover:hover){.door:hover{border-color:rgba(255,155,47,.32);box-shadow:0 22px 56px rgba(0,0,0,.45),0 0 30px rgba(255,125,26,.08)}}

/* кнопки: блик при наведении, мягкое свечение, пружинка */
.go,.fbtn,.acts>button:not(.ghost):not(.bad):not(.hold){position:relative;overflow:hidden}
.go:before,.fbtn:before,.acts>button:not(.ghost):not(.bad):not(.hold):before{content:"";position:absolute;top:0;bottom:0;left:-80%;width:50%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);transition:left .65s var(--ease)}
@media(hover:hover){.go:hover:not(:disabled):before,.fbtn:hover:not(:disabled):before,.acts>button:not(.ghost):not(.bad):not(.hold):hover:not(:disabled):before{left:135%}}
.go:not(:disabled){animation:glow 3.2s ease-in-out infinite}
button.ghost:hover:not(:disabled){border-color:rgba(255,155,47,.5);color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* меню: иконка подпрыгивает, активная вкладка покачивается */
@media(hover:hover){header nav button:not(:disabled):hover span:first-child{transform:translateY(-3px) scale(1.1)}}
header nav button:not(:disabled):active span:first-child{transform:scale(.9)}
header nav button.cur span:first-child{animation:bob 2.6s ease-in-out infinite}
header nav button:disabled{opacity:1;cursor:not-allowed;filter:grayscale(.6)}
header nav button.off>span:not(.soon-b){opacity:.5}
header nav button.off:hover span:first-child{transform:none}
.soon-b{position:absolute;top:.05rem;right:.1rem;padding:.02rem .4rem;border:1px solid rgba(255,155,47,.45);border-radius:999px;background:rgba(255,155,47,.16);color:#ffd9a8;font:700 .5rem/1.5 Georgia,serif;letter-spacing:.07em;text-transform:uppercase}

/* форум: темы обсуждения */
.topics{position:relative;display:flex;gap:.45rem;overflow-x:auto;padding:.15rem .85rem .7rem;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.topics::-webkit-scrollbar{display:none}
.tp{flex:none;display:inline-flex;align-items:center;gap:.4rem;min-height:2.3rem;padding:.3rem .9rem;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.04);color:var(--muted);font:600 .82rem/1 Georgia,serif;white-space:nowrap;box-shadow:none;scroll-snap-align:start;animation:pop .45s var(--spring) backwards;animation-delay:calc(var(--i,0)*40ms);transition:background .25s,color .25s,border-color .25s,box-shadow .25s,transform .2s var(--spring)}
.tp span{font-size:1rem;line-height:1}
@media(hover:hover){.tp:hover{transform:translateY(-2px);border-color:rgba(255,155,47,.5);color:var(--text);box-shadow:0 6px 18px rgba(255,125,26,.14)}}
.tp.on{background:linear-gradient(135deg,rgba(255,155,47,.3),rgba(194,80,14,.18));border-color:rgba(255,155,47,.65);color:var(--gold);box-shadow:0 0 18px rgba(255,125,26,.22)}
.tchip{display:inline-flex;align-items:center;gap:.3rem;min-height:0;margin-top:.3rem;padding:.12rem .6rem;border:1px solid rgba(255,155,47,.4);border-radius:999px;background:rgba(255,155,47,.1);color:#ffd3a0;font:600 .72rem/1.4 Georgia,serif;box-shadow:none;transition:background .2s,transform .2s var(--spring)}
@media(hover:hover){.tchip:hover{background:rgba(255,155,47,.22);transform:translateY(-1px) scale(1.04);filter:none;box-shadow:none}}
.tpick{display:flex;flex-wrap:wrap;gap:.4rem}
.tpick .tp{min-height:2rem;padding:.2rem .75rem;font-size:.76rem;animation:none}
.tw-row:not(.big):not(.sk-row):hover{background:linear-gradient(90deg,rgba(255,155,47,.06),transparent 70%)}
.ftabs button.on{box-shadow:0 0 14px rgba(255,125,26,.18)}
.ib{transition:background .2s,color .2s,transform .2s var(--spring)}
@media(hover:hover){.ib:hover{transform:scale(1.08)}}
#fbar button{transition:border-color .25s,color .25s,transform .25s var(--spring),box-shadow .25s}
@media(hover:hover){#fbar button:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 22px rgba(255,125,26,.15)}}
@media(prefers-reduced-motion:reduce){body:after,.logo,.go,header nav button.cur span:first-child,.tp{animation:none!important}}


/* ===== v6: больше движения, стекло, светящиеся рамки ===== */
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
@keyframes navIn{from{opacity:0;transform:translateY(-10px) scale(.85)}to{opacity:1;transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}60%{transform:rotate(10deg)}}
@keyframes mote{0%{transform:translate3d(0,0,0) scale(.6);opacity:0}12%{opacity:.85}88%{opacity:.45}100%{transform:translate3d(var(--dx),-108vh,0) scale(1.1);opacity:0}}

/* прогресс прокрутки и шапка при прокрутке */
header:before{content:"";position:absolute;left:0;top:0;height:2px;width:calc(var(--sp,0)*100%);pointer-events:none;background:linear-gradient(90deg,#ff9b2f,#ff6b6b);box-shadow:0 0 10px rgba(255,125,26,.7);transition:width .12s linear}
header{transition:background .3s,box-shadow .3s}
body.scrolled header{background:rgba(9,5,14,.9);box-shadow:0 12px 40px rgba(0,0,0,.45)}

/* фон: пылинки и свет за курсором */
.motes{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.motes i{position:absolute;bottom:-12px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,rgba(255,200,125,.95),rgba(255,140,40,0) 70%);opacity:0;animation:mote var(--d) linear var(--dl) infinite}
.cglow{position:fixed;left:0;top:0;z-index:-1;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,155,47,.12),transparent 65%);opacity:0;transition:opacity .6s;will-change:transform}
.cglow.on{opacity:1}

/* заголовки */
h1{background:linear-gradient(100deg,#ff9b2f 25%,#ffe9c8 50%,#ff9b2f 75%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px rgba(255,125,26,.3));animation:sheen 9s linear infinite}
#app>div>h1{animation:rise .6s var(--ease) backwards,sheen 9s linear infinite}
.v-home .stats .stat span,.v-update .stats.cd .stat span{background:linear-gradient(180deg,#ffe0a8,#ff8a3d 70%,#ff6b6b);-webkit-background-clip:text;background-clip:text;color:transparent}

/* стеклянные карточки со светящейся рамкой */
.card,.door,.tm,.stat,.hero{position:relative}
.door,.hero,.tm{backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2)}
.door:after,.hero:after,.tm:after{content:"";position:absolute;inset:-1px;padding:1px;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,179,71,.42),rgba(255,255,255,.05) 40%,rgba(255,107,107,.22));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@media(hover:hover){
  .card:before,.door:before,.tm:before,.stat:before,.hero:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,179,71,.14),transparent 60%)}
  .card:hover:before,.door:hover:before,.tm:hover:before,.stat:hover:before,.hero:hover:before{opacity:1}
  .door:hover:after,.tm:hover:after{background:conic-gradient(from var(--ang),rgba(255,255,255,.06),rgba(255,179,71,.95) 12%,rgba(255,255,255,.06) 32%,rgba(255,255,255,.06));animation:spin 3.2s linear infinite}
  .tm:hover,.stat:hover{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px);transition:transform .12s ease-out,border-color .25s,box-shadow .25s}
}

/* кнопки: новый градиент и реакции */
.go,.fbtn:not(.on),.acts>button:not(.ghost):not(.bad):not(.hold){background:linear-gradient(135deg,#ffc266,#ff8a3d 55%,#e8541c)}
.fbtn.on{animation:pop .4s var(--spring)}
.lk{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .3s var(--ease)}
.lk:hover{background-size:100% 1px}
label{transition:color .2s}label:focus-within{color:#ffd9a8}
@media(hover:hover){#fbar button:hover .ico{animation:wiggle .5s ease}}

/* меню: плавающая подсветка активной вкладки и появление */
header nav{position:relative}
header nav button{z-index:1;animation:navIn .55s var(--spring) backwards}
header nav button:nth-of-type(1){animation-delay:.02s}header nav button:nth-of-type(2){animation-delay:.08s}header nav button:nth-of-type(3){animation-delay:.14s}header nav button:nth-of-type(4){animation-delay:.2s}header nav button:nth-of-type(5){animation-delay:.26s}header nav button:nth-of-type(6){animation-delay:.32s}
header nav button:last-of-type{margin-right:auto}
.nav-ind{position:absolute;z-index:0;left:0;top:0;border-radius:18px;pointer-events:none;opacity:0;background:linear-gradient(150deg,rgba(255,155,47,.3),rgba(255,107,107,.1));border:1px solid rgba(255,155,47,.6);box-shadow:0 0 18px rgba(255,125,26,.24);transition:transform .5s var(--spring),width .45s var(--ease),height .45s var(--ease),opacity .3s}
header nav.has-ind button.cur{background:none;border-color:transparent;box-shadow:none}
@media(prefers-reduced-motion:reduce){.motes,.cglow{display:none}h1,#app>div>h1{animation:none!important}.tm:hover,.stat:hover{transform:none}}
.ticon{display:inline-grid;place-items:center;flex:none;width:1.3rem;height:1.3rem;color:var(--gold);font:700 .95rem/1 Georgia,serif}
.ticon img{display:block;width:100%;height:100%;object-fit:contain}
.tchip .ticon{width:1rem;height:1rem;font-size:.75rem}
.tpick .ticon{width:1.15rem;height:1.15rem}
.tp.on .ticon,.tp:hover .ticon{filter:drop-shadow(0 0 5px rgba(255,155,47,.6))}

/* --- обновления --- */
.ev{margin-top:1rem}.ev-t{text-align:center;margin:.2rem 0 0}
.ev-cover{display:block;width:100%;height:auto;border-radius:16px;margin:0 0 .8rem}
.ev-l{margin-top:1.1rem;text-align:left}.ev-l h3{margin:0 0 .6rem;font-size:1rem;color:var(--gold)}
.ev-l ul{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.ev-l li{position:relative;padding:.5rem .8rem .5rem 2.1rem;border:1px solid rgba(255,155,47,.18);border-radius:14px;background:rgba(255,155,47,.05);animation:rise .5s var(--ease) backwards}
.ev-l li:before{content:"✓";position:absolute;left:.8rem;top:.5rem;color:var(--gold)}
.ev-l li:nth-child(2){animation-delay:.05s}.ev-l li:nth-child(3){animation-delay:.1s}.ev-l li:nth-child(4){animation-delay:.15s}.ev-l li:nth-child(5){animation-delay:.2s}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.gal figure{margin:0;aspect-ratio:16/10;border-radius:14px;overflow:hidden;border:1px solid rgba(255,155,47,.2);cursor:zoom-in;animation:pop .45s var(--spring) backwards;animation-delay:calc(var(--i,1)*60ms)}
.gal img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .45s var(--ease)}
@media(hover:hover){.gal figure:hover img{transform:scale(1.07)}}
.ev-old{margin-top:1.2rem}.ev-old>summary{cursor:pointer;color:var(--muted)}
.lbx{position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:rgba(5,2,9,.92);backdrop-filter:blur(6px);cursor:zoom-out;animation:lbxIn .25s ease;outline:0}
.lbx img{max-width:94vw;max-height:90vh;border-radius:14px;box-shadow:0 20px 70px rgba(0,0,0,.6)}
@keyframes lbxIn{from{opacity:0}}
</style>
