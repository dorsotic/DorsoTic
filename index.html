/* ---------- Выбор достижений с поиском ---------- */
function picker(items, max = 5) {
  const sel = [];
  const btn = h("button", {type:"button", class:"ghost pk-btn"}, "Выбери достижения");
  const q = h("input", {class:"pk-q", placeholder:"Поиск достижения…", "aria-label":"Поиск достижения"});
  const ul = h("div", {class:"pk-list", role:"listbox"});
  const done = h("button", {type:"button", class:"pk-done", onclick:() => { panel.hidden = true; }}, "Готово");
  const panel = h("div", {class:"pk-panel"}, q, ul, done);
  panel.hidden = true;
  const tags = h("div");
  const el = h("div", {class:"pk"}, btn, panel, tags);

  const refresh = () => {
    btn.textContent = sel.length ? `Выбрано: ${sel.length} из ${max}` : "Выбери достижения";
    tags.replaceChildren(...sel.map(n =>
      h("span", {class:"tag"}, n,
        h("button", {
          type:"button",
          class:"ghost",
          "aria-label":"Убрать",
          onclick:() => toggle(n)
        }, "×")
      )
    ));
    draw();
  };

  const toggle = n => {
    const i = sel.indexOf(n);
    if (i >= 0) sel.splice(i, 1);
    else if (sel.length < max) sel.push(n);
    else return toast(`Не больше ${max} достижений в одной заявке`, 1);
    refresh();
  };

  const draw = () => {
    const s = q.value.trim().toLowerCase();
    const m = items.filter(n => n.toLowerCase().includes(s));

    ul.replaceChildren(
      ...(m.length
        ? m.map(n => h(
            "div",
            {
              class:"pk-i" + (sel.includes(n) ? " on" : ""),
              role:"option",
              tabindex:"0",
              onclick:() => toggle(n),
              onkeydown:e => { if (e.key === "Enter") toggle(n); }
            },
            h("span", {}, (sel.includes(n) ? "✓ " : "") + n)
          ))
        : [h("div", {class:"pk-i empty"}, items.length ? "Ничего не найдено" : "Список достижений пока пуст")]
      )
    );
  };

  btn.onclick = () => {
    panel.hidden = !panel.hidden;
    if (!panel.hidden) {
      q.value = "";
      draw();
      if (!matchMedia("(pointer:coarse)").matches) q.focus();
    }
  };

  q.oninput = draw;
  // composedPath: после перерисовки списка e.target уже не в DOM, но путь события сохраняется
  document.addEventListener("click", e => {
    if (!e.composedPath().includes(el)) panel.hidden = true;
  });

  return {
    el,
    get:() => [...sel],
    clear:() => {
      sel.length = 0;
      refresh();
    }
  };
}

      h("div", {class:"meta"}, h("span", {class:"pill " + r.status}, ST[r.status]), `${r.taken_by && profiles[r.taken_by] ? " " + profiles[r.taken_by].nickname + " ·" : ""} ${fmt(r.created_at)} · ${ago(r.created_at)} назад`));
    const a = h("div", {class:"acts"});
    if (r.status === "new") a.append(h("button", {onclick:() => act("start_request", {p_id:r.id}, c)}, "Начать работу"));
    if (r.status === "in_progress" && can) a.append(
      h("button", {onclick:() => act("close_request", {p_id:r.id}, c)}, "Закрыть заявку"),
      h("button", {class:"hold", onclick:() => holdUI(c, r)}, "В ожидание"),
      h("button", {class:"ghost", onclick:() => transferUI(c, r)}, "Передать"));
    if (r.status === "waiting" && can) a.append(
      h("button", {onclick:() => act("resume_request", {p_id:r.id}, c)}, "Вернуть в работу"),
      h("button", {class:"ghost", onclick:() => act("close_request", {p_id:r.id}, c)}, "Закрыть заявку"),
      h("button", {class:"ghost", onclick:() => transferUI(c, r)}, "Передать"));
    a.append(h("button", {class:"ghost", onclick:() => copy(r.username, "Контакт скопирован: " + r.username)}, "Копировать контакт"));
    a.append(h("button", {class:"bad", onclick:() => confirm("Удалить заявку?") && act("delete_request", {p_id:r.id}, c)}, "Удалить"));
    c.append(a); return c;
  };
  const fill = () => {
    btns.forEach(b => b.textContent = `${ST[b.dataset.k]} (${data.filter(r => r.status === b.dataset.k).length})`);
    const rows = data.filter(r => r.status === rf && (!q || `${r.nickname} ${r.achievement} ${r.username}`.toLowerCase().includes(q))).sort((a, b) => !!b.reward - !!a.reward);
    list.classList.toggle("still", !first);
    list.replaceChildren(...(rows.length ? rows.map(card) : [h("p", {class:"empty"}, "Здесь пока пусто.")]));
    first = false;
  };
  const load = async manual => {
    if (!manual && list.querySelector(".tr")) return;
    const { data: d, error } = await db.from("requests").select("*").order("created_at", {ascending:false}).limit(200);
    if (error) { if (manual) toast("Не удалось загрузить заявки.", 1); return; }
    const n = d.filter(r => r.status === "new").length;
    if (lastNew !== null && n > lastNew) toast("Новая заявка!");
    lastNew = n; document.title = (n ? `(${n}) ` : "") + TITLE;
    data = d; if (manual) first = true; fill();
  };
  const sq = h("input", {class:"sq", placeholder:"Поиск: ник, достижение, юзернейм…", "aria-label":"Поиск по заявкам", oninput:e => { q = e.target.value.trim().toLowerCase(); fill(); }});
  box.append(chips, sq, list);
  await load(true);
  timer = setInterval(() => load(), 15000);
}
async function tabProfile(box) {

    pwBtn.disabled = true;

    pwBtn.disabled = false;
    if (error) return toast("Не удалось сменить пароль.", 1);
    pw.value = ""; toast("Пароль изменён.");
  }}, "Сменить пароль");
  box.append(out, h("div", {class:"sep"}), h("h2", {style:"margin-top:0"}, "Аккаунт"), fld("Новый пароль", pw),
    h("div", {class:"acts"}, pwBtn, h("button", {class:"ghost", onclick:async () => { await db.auth.signOut(); me = null; drawNav(); go("home"); }}, `Выйти (${me.nickname} · ${ROLE[me.role]})`)));
  await draw();
}

  const L = {start:"начал(а) работу", close:"закрыл(а)", delete:"удалил(а)", cancel:"отозвал(а) заявку", transfer:"передал(а) заявку", hold:"перевёл(а) в ожидание", resume:"вернул(а) в работу"};

async function tabAch(box) {
  const ta = h("textarea", {placeholder:"По одному достижению в строке", style:"min-height:140px"});
  const list = h("div");
  const load = async () => {
    const { data } = await db.from("achievements").select("*").order("name");
    list.replaceChildren(h("h2", {}, `Список достижений (${data?.length || 0})`), ...(data || []).map(a => h("div", {class:"card closed", style:"display:flex;justify-content:space-between;align-items:center;padding:4px 12px"},
      a.name, h("button", {class:"ghost", onclick:async () => { await db.from("achievements").delete().eq("id", a.id); load(); }}, "×"))));
  };
  const preset = h("button", {class:"ghost preset", onclick:async () => {
    preset.disabled = true;
    const { data: oldRows, error: readError } = await db.from("achievements").select("id");
    if (readError) {
      preset.disabled = false;
      return toast("Не удалось обновить список.", 1);
    }
    if (oldRows?.length) {
      const { error: delError } = await db.from("achievements").delete().in("id", oldRows.map(x => x.id));
      if (delError) {
        preset.disabled = false;
        return toast("Не удалось очистить старый список.", 1);
      }
    }
    const { error } = await db.from("achievements").insert(Object.keys(CAT).map(name => ({name})));
    preset.disabled = false;
    if (error) return toast("Не удалось загрузить список.", 1);
    toast(`Актуальный список загружен: ${Object.keys(CAT).length}`);
    load();
  }}, `Загрузить актуальный список (${Object.keys(CAT).length})`);
  box.append(h("div", {class:"door"}, fld("Добавить достижения", ta), h("button", {class:"go", onclick:async () => {
    const rows = [...new Set(ta.value.split("\n").map(s => s.trim()).filter(Boolean))].map(name => ({name}));
    if (!rows.length) return;
    const { error } = await db.from("achievements").upsert(rows, {onConflict:"name", ignoreDuplicates:true});
    if (error) return toast("Не удалось добавить.", 1);
    ta.value = ""; toast("Добавлено."); load();
  }}, "Добавить"), h("div", {}, preset)), list);
  load();
}
