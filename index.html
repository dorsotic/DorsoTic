<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Достижения DOORS: помощь с ачивками — DorsoTic</title>
<meta name="description" content="DorsoTic — помощь с достижениями в DOORS (Roblox). Оставь заявку, и помощник свяжется с тобой в Discord или Telegram.">
<meta name="theme-color" content="#17100e">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://swdmjwgwripgpcnglhse.supabase.co wss://swdmjwgwripgpcnglhse.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317100e'/%3E%3Cpath d='M9 28V12a7 7 0 0 1 14 0v16z' fill='none' stroke='%23d4ac55' stroke-width='2.5'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
@font-face{font-family:"Doors";src:url("Doors%20Cyrillic%20Font.ttf") format("truetype");font-display:swap}
:root{--bg:#17100e;--p:#251915;--p2:#2e201a;--line:#46322a;--text:#f1e6d3;--mute:#bda88f;--brass:#d4ac55;--ok:#8fb573;--wait:#e0905f;--hold:#7fa6d1;--r:.6rem;--f:"Doors",Georgia,serif}
html{font-size:15px;-webkit-text-size-adjust:100%}*{box-sizing:border-box}
body{margin:0;color:var(--text);font:1rem/1.45 Georgia,serif;min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% -10%,rgba(212,172,85,.14),transparent 55%),var(--bg);background-attachment:fixed}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(.5rem + env(safe-area-inset-top)) 1rem .5rem;background:rgba(23,16,14,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
h1,h2,.logo,.go,.tabs button,.stat span{font-family:var(--f);font-weight:400;letter-spacing:.05em}
.logo{font-size:1.7rem;color:var(--brass);cursor:pointer}
.rate{font-size:.8rem;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:.15rem .7rem;white-space:nowrap}
nav{position:fixed;left:50%;bottom:calc(.6rem + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;display:flex;gap:.1rem;padding:.25rem;background:rgba(37,25,21,.96);border:1px solid var(--line);border-radius:1.1rem;box-shadow:0 8px 26px rgba(0,0,0,.55)}
nav button{display:flex;flex-direction:column;align-items:center;min-width:3.9rem;padding:.3rem .5rem;background:transparent;color:var(--mute);font-size:.7rem;font-weight:400;border:1px solid transparent}
nav button.cur{color:var(--brass);background:rgba(212,172,85,.14);border-color:rgba(212,172,85,.5)}
main{flex:1;width:100%;max-width:44rem;margin:0 auto;padding:1.2rem 1rem 6.5rem}main.wide{max-width:62rem}
h1{font-size:clamp(1.8rem,7vw,2.4rem);margin:0 0 .4rem;color:var(--brass);text-align:center}h2{font-size:1.25rem;margin:1.3rem 0 .6rem}
.sub{color:var(--mute);margin:0 0 1rem;text-align:center;font-size:.92rem}
.door,.mdl{background:linear-gradient(180deg,var(--p2),var(--p));border:2px solid var(--line);border-radius:1rem 1rem 0 0;padding:1rem}
label,.lbl{display:block;margin-top:.65rem;font-size:.82rem;color:var(--mute)}
input,textarea,select{display:block;width:100%;margin-top:.25rem;background:rgba(0,0,0,.28);color:var(--text);border:1px solid var(--line);border-radius:var(--r);padding:.5rem .65rem;font:inherit;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--brass);outline:none;box-shadow:0 0 0 3px rgba(212,172,85,.22)}
textarea{min-height:4rem;resize:vertical}.row{display:grid;grid-template-columns:9rem 1fr;gap:.6rem}
button{background:var(--brass);color:#241a06;border:0;border-radius:var(--r);padding:.45rem .9rem;font:inherit;font-size:.88rem;font-weight:700;cursor:pointer;min-height:2.3rem}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}button.bad{background:#a5473a;color:#fff}button.hold{background:var(--hold);color:#0f1a26}
.go{margin-top:.9rem;font-size:1.05rem;padding:.5rem 1.3rem}.hp{position:absolute;left:-9999px;width:1px}
.msg{margin-top:.5rem;min-height:1.3em;font-size:.9rem}.err,.warn{color:var(--wait)}.good{color:var(--ok)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}.tabs button{background:rgba(0,0,0,.25);color:var(--mute);border:1px solid var(--line)}.tabs button.on{background:var(--brass);color:#241a06}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(17rem,100%),1fr));gap:.5rem}
.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:.55rem .75rem;margin-bottom:.5rem;overflow-wrap:anywhere}
.grid .card{margin:0}.card.new{border-left-color:var(--wait)}.card.in_progress{border-left-color:var(--brass)}.card.waiting{border-left-color:var(--hold)}.card.closed{border-left-color:var(--ok)}
.meta{color:var(--mute);font-size:.8rem;margin-top:.15rem}
.pill{display:inline-block;padding:0 .6rem;border-radius:99px;font-size:.72rem;font-weight:700;color:#241a06;background:var(--mute)}.pill.new{background:var(--wait)}.pill.in_progress{background:var(--brass)}.pill.waiting{background:var(--hold)}.pill.closed{background:var(--ok)}
.acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}.acts button{padding:.3rem .7rem;font-size:.82rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.5rem;margin-bottom:.8rem}
.stat{background:var(--p);border:1px solid var(--line);border-radius:var(--r);padding:.5rem .75rem;color:var(--mute);font-size:.8rem}.stat span{display:block;font-size:1.8rem;color:var(--brass)}
.stars{letter-spacing:2px;background:linear-gradient(90deg,var(--brass) var(--v,0%),var(--line) var(--v,0%));-webkit-background-clip:text;background-clip:text;color:transparent}
.pick{display:flex;margin-top:.3rem}.pick button{background:none;color:var(--line);font-size:1.6rem;padding:0 .2rem}.pick button.on{color:var(--brass)}
.pk-list{max-height:13rem;overflow:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:.3rem}
.pk-i{padding:.5rem .7rem;cursor:pointer;font-size:.92rem;border-bottom:1px solid rgba(70,50,42,.5)}.pk-i:hover,.pk-i:focus{background:rgba(212,172,85,.16);outline:none}.pk-i.on{color:var(--brass);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:.2rem;background:rgba(212,172,85,.14);border:1px solid var(--brass);border-radius:99px;padding:0 .2rem 0 .7rem;font-size:.8rem;margin:.4rem .3rem 0 0}.tag button{min-height:0;padding:0 .5rem;border:0}
.gift{display:inline-block;padding:0 .6rem;border-radius:99px;background:rgba(143,181,115,.16);color:var(--ok);border:1px solid var(--ok);font-size:.78rem;margin-top:.3rem}
.note{font-size:.8rem;color:var(--hold);margin-top:.2rem}.empty{color:var(--mute)}
details{background:var(--p);border:1px solid var(--line);border-radius:var(--r);padding:.5rem .8rem;margin-bottom:.5rem}summary{cursor:pointer;font-weight:700}details p{color:var(--mute);margin:.5rem 0 0}
footer{border-top:1px solid var(--line);padding:.8rem 1rem 5.5rem;text-align:center;color:var(--mute);background:rgba(0,0,0,.2);font-size:.8rem}
.lk{color:var(--mute);font-size:.74rem;text-decoration:underline dotted}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--p2);border:1px solid var(--brass);padding:.5rem 1rem;border-radius:var(--r);z-index:60;font-size:.9rem;max-width:calc(100vw - 1.5rem);text-align:center}.toast.bad{border-color:var(--wait)}
.bd{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:1rem}
.mdl{width:min(26rem,100%);border-radius:1rem}.mdl h2{margin-top:0}.mdl p{color:var(--mute);margin:.4rem 0}.mdl .acts{justify-content:flex-end}
@media(max-width:520px){.row{grid-template-columns:1fr}.go{width:100%}.acts button{flex:1 1 30%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="logo" id="logo">DorsoTic</div><div class="rate" id="rate"></div></header>
<main id="app"></main>
<footer><div id="fr"></div><div id="fl"></div>
<div class="meta" style="max-width:34rem;margin:.6rem auto 0">Неофициальный сервис. Не связан с Roblox Corporation и Lightning Bolt Studios (DOORS). Мы храним ник Roblox, юзернейм мессенджера и текст заявки только для её выполнения; через 30 дней после закрытия заявка обезличивается.</div></footer>
<nav id="nav" aria-label="Меню"></nav>
<noscript><p style="text-align:center;padding:2rem">Для работы сайта нужен JavaScript.</p></noscript>
<script src="app.js"></script>
</body>
</html>
