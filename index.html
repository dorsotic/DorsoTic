body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{background:none;border:0;padding:0;min-height:0;font-family:var(--f);font-size:1.8rem;line-height:1.2;letter-spacing:.04em;color:var(--brass);cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:wrap}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:28px 16px 40px}
main.wide{max-width:1040px}
h1,h2{margin:0}
h1{font-family:var(--f);font-weight:400;letter-spacing:.04em;font-size:clamp(2rem,7vw,2.8rem);line-height:1.1;color:var(--brass)}
h2{font-size:1.1rem;font-weight:700;margin:28px 0 12px}
.sub{color:var(--mute);margin:8px 0 24px}
.view>h1,.view>.sub{text-align:center}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
label,.lbl{display:block;margin:14px 0 0;font-size:.9rem;color:var(--mute)}
.panel>:first-child{margin-top:0}
input,textarea,select{display:block;width:100%;margin-top:5px;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font:inherit}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:-1px;border-color:var(--brass)}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:150px 1fr;gap:12px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

button{background:var(--brass);color:#1a1205;border:0;border-radius:var(--r);padding:9px 16px;min-height:40px;font:inherit;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
button:disabled{opacity:.5;cursor:default;filter:none}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--brass);filter:none}
button.bad{background:var(--bad);color:#fff}
button.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.go{margin-top:20px;padding:11px 24px}

.msg{margin-top:10px;min-height:1.4em}
.err{color:var(--wait)}
.good{color:var(--ok)}
.empty{color:var(--mute)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:transparent;color:var(--mute);border:1px solid var(--line)}
.tabs button:hover{color:var(--text);filter:none}
.tabs button.on{background:var(--brass);color:#1a1205;border-color:var(--brass)}
.tabs.top{position:sticky;top:var(--hh,57px);z-index:10;margin:0 0 16px;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px;overflow-wrap:anywhere}
.grid .card{margin:0}
.card.new{border-left-color:var(--wait)}
.card.in_progress{border-left-color:var(--brass)}
.card.closed{border-left-color:var(--ok)}
.card b{display:block;margin-bottom:2px}
.meta{color:var(--mute);font-size:.86rem;margin-top:4px}
.pill{display:inline-block;padding:0 9px;border-radius:99px;font-size:.76rem;font-weight:700;color:#1a1205;background:var(--mute)}
.pill.new{background:var(--wait)}
.pill.in_progress{background:var(--brass)}
.pill.closed{background:var(--ok)}
.gift{display:inline-block;margin-top:6px;padding:0 9px;border:1px solid var(--ok);border-radius:99px;color:var(--ok);font-size:.82rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts button{padding:6px 12px;min-height:36px;font-size:.9rem}
.tr{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tr select{margin:0;flex:1 1 150px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--mute);font-size:.9rem}
.stat span{display:block;font-family:var(--f);font-size:2.2rem;line-height:1.1;color:var(--brass)}
.stats.gap{margin-bottom:22px}

.stars{font-size:1.1rem;letter-spacing:2px;background:linear-gradient(90deg,var(--brass) var(--v,0%),var(--line) var(--v,0%));-webkit-background-clip:text;background-clip:text;color:transparent}
.pick{display:flex;gap:2px;margin-top:6px}
.pick button{background:none;color:var(--line);font-size:1.7rem;line-height:1;padding:0 4px;min-width:40px}
.pick button.on{color:var(--brass)}
.rv textarea{min-height:60px;margin-top:8px}

.pk-btn{width:100%;text-align:left;margin-top:5px;font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:2px;padding:0 2px 0 10px;border:1px solid var(--brass);border-radius:99px;font-size:.86rem}
.tag button{color:var(--text);min-height:28px;min-width:28px;padding:0;border:0;background:none;font-size:1.1rem;line-height:1}
.pk-panel{margin-top:8px;padding:8px;background:var(--field);border:1px solid var(--line);border-radius:var(--r)}
.pk-panel[hidden]{display:none}
.pk-q{margin:0 0 8px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fchips button{padding:3px 11px;min-height:30px;font-size:.82rem;font-weight:400;background:transparent;color:var(--mute);border:1px solid var(--line)}
.fchips button.on{background:var(--brass);color:#1a1205;border-color:var(--brass)}
.pk-list{max-height:260px;overflow:auto;overscroll-behavior:contain}
.pk-i{padding:7px 10px 7px 28px;border-radius:var(--r);cursor:pointer;position:relative}
.pk-i:hover,.pk-i:focus-visible{background:rgba(207,168,80,.12);outline:none}
.pk-i.on{color:var(--brass)}
.pk-i.on::before{content:"✓";position:absolute;left:10px}
.pk-i .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pk-i small{display:block;color:var(--mute);font-size:.8rem}
.dif{flex:none;padding:0 8px;border-radius:99px;font-size:.72rem;font-weight:700;color:#1a1205}
.dif.e{background:var(--ok)}
.dif.m{background:var(--brass)}
.dif.h{background:var(--wait)}
.preset{margin-top:14px}

ol.flow{list-style:none;margin:0;padding:0;counter-reset:s}
ol.flow li{counter-increment:s;position:relative;margin:0 0 10px;padding-left:46px}
ol.flow li::before{content:counter(s);position:absolute;left:0;top:8px;width:32px;height:32px;border-radius:50%;border:1px solid var(--brass);color:var(--brass);display:grid;place-items:center;font-family:var(--f)}
details{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:0 0 8px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--brass);font-size:1.25rem;line-height:1}
details[open] summary::after{content:"−"}
details p{margin:8px 0 0;color:var(--mute)}

footer{border-top:1px solid var(--line);padding:16px 16px calc(16px + env(safe-area-inset-bottom));text-align:center;color:var(--mute);font-size:.9rem}
footer .stars{font-size:1.3rem}

.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50;padding:0 14px}
.toast{background:var(--panel);border:1px solid var(--brass);border-radius:var(--r);padding:10px 16px;max-width:100%;text-align:center;animation:fade .2s ease-out}
.toast.bad{border-color:var(--wait)}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (max-width:600px){
 .row{grid-template-columns:1fr}
 main{padding:20px 14px 32px}
 .panel{padding:16px 14px}
 .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
 .tabs::-webkit-scrollbar{display:none}
 .tabs button{flex:none}
 .grid{grid-template-columns:1fr}
 .acts button{flex:1 1 auto}
 .go{width:100%}
 button{min-height:44px}
 .logo{font-size:1.5rem}
}
@media (hover:none){button:hover{filter:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

// Кнопка с подтверждением вместо confirm(): первый клик взводит, второй выполняет.
function confirmBtn(label, cls, run) {

  b.onclick = () => {

/* ---------- Выбор достижений ---------- */
function picker(items, max = 5) {
  const sel = []; let df = "";
  const ordered = [...items].sort((a, b) => (RANK[CAT[a]?.[0]] ?? 3) - (RANK[CAT[b]?.[0]] ?? 3) || a.localeCompare(b));
  const btn = h("button", {type:"button", class:"ghost pk-btn", "aria-expanded":"false"}, "Выбрать достижения");
  const q = h("input", {class:"pk-q", type:"search", placeholder:"Поиск по названию или описанию", "aria-label":"Поиск достижения"});
  const chips = h("div", {class:"fchips"});
  const ul = h("div", {class:"pk-list", role:"listbox", "aria-multiselectable":"true"});
  const panel = h("div", {class:"pk-panel"}, q, chips, ul); panel.hidden = true;
  const tags = h("div", {class:"tags"});
  const el = h("div", {class:"pk"}, btn, tags, panel);

  [["", "Все"], ["e", "Лёгкие"], ["m", "Средние"], ["h", "Сложные"]].forEach(([k, l]) => {
    const b = h("button", {type:"button", class:k === df ? "on" : "", onclick:() => { df = k; [...chips.children].forEach(x => x.classList.toggle("on", x === b)); draw(); }}, l);
    chips.append(b);
  });
  const mark = () => ul.querySelectorAll(".pk-i[data-n]").forEach(x => {
    const on = sel.includes(x.dataset.n); x.classList.toggle("on", on); x.setAttribute("aria-selected", on);
  });
  const refresh = () => {
    btn.textContent = sel.length ? `Выбрано: ${sel.length} из ${max}` : "Выбрать достижения";
    tags.replaceChildren(...sel.map(n => h("span", {class:"tag"}, n, h("button", {type:"button", "aria-label":"Убрать " + n, onclick:() => toggle(n)}, "×"))));
    mark();
  };
  const toggle = n => {
    const i = sel.indexOf(n);
    if (i >= 0) sel.splice(i, 1);
    else if (sel.length < max) sel.push(n);
    else return toast(`Не больше ${max} достижений в одной заявке`, 1);
    refresh();
  };
  const draw = () => {
    const s = q.value.trim().toLowerCase();
    const m = ordered.filter(n => (!df || CAT[n]?.[0] === df) && (n.toLowerCase().includes(s) || (CAT[n]?.[1] || "").toLowerCase().includes(s)));
    ul.replaceChildren(...(m.length ? m.map(n => h("div", {class:"pk-i", role:"option", tabindex:"0", "data-n":n},
      h("div", {class:"t"}, h("span", {}, n), CAT[n] ? h("span", {class:"dif " + CAT[n][0]}, DIF[CAT[n][0]]) : null),
      CAT[n] ? h("small", {}, CAT[n][1]) : null))
      : [h("div", {class:"empty", style:"padding:8px 10px"}, items.length ? "Ничего не найдено" : "Список достижений пока пуст")]));
    mark();
  };
  const setOpen = o => {
    panel.hidden = !o; btn.setAttribute("aria-expanded", o);
    if (o) { draw(); if (!matchMedia("(pointer:coarse)").matches) q.focus(); }
  };
  ul.onclick = e => { const i = e.target.closest(".pk-i"); if (i?.dataset.n) toggle(i.dataset.n); };
  ul.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset?.n) { e.preventDefault(); toggle(e.target.dataset.n); } };
  el.onkeydown = e => { if (e.key === "Escape" && !panel.hidden) { setOpen(false); btn.focus(); } };
  btn.onclick = () => setOpen(panel.hidden);
  let dt; q.oninput = () => { clearTimeout(dt); dt = setTimeout(draw, 120); };
  document.addEventListener("click", e => { if (!el.contains(e.target)) setOpen(false); }, {signal:vc.signal});
  return {el, get:() => [...sel], clear:() => { sel.length = 0; refresh(); }};
}

  const pk = picker([...names]);
  const plat = h("select", {}, h("option", {value:"discord"}, "Discord"), h("option", {value:"telegram"}, "Telegram"));
  const un = h("input", {maxlength:40, placeholder:"@username", autocomplete:"off", autocapitalize:"off"});
  const note = h("textarea", {maxlength:300});
  const reward = h("input", {maxlength:100, placeholder:"Например: предмет, ключ, золото"});
  const site = h("input", {class:"hp", tabindex:"-1", autocomplete:"off", "aria-hidden":"true"});
  const msg = h("div", {class:"msg", role:"status"});
  const mine = h("div");
  const btn = h("button", {class:"go"}, "Отправить заявку");
  btn.onclick = async () => {
    msg.className = "msg err";
    if (site.value) return;
    const u = un.value.trim().replace(/^@/, "");
    const chosen = pk.get();
    if (!nick.value.trim() || !chosen.length || !chosen.every(n => names.has(n))) { msg.textContent = "Укажи ник и выбери хотя бы одно достижение."; return; }
    if (!/^[A-Za-z0-9_.]{2,32}$/.test(u)) { msg.textContent = "Юзернейм: буквы, цифры, _ и точка, например @DorsoNews."; return; }
    if (Date.now() - (+localStorage.getItem("last") || 0) < 60000) { msg.textContent = "Подожди минуту перед следующей заявкой."; return; }
    btn.disabled = true;
    const token = crypto.randomUUID();
    const { error } = await db.from("requests").insert({token, nickname:nick.value.trim(), achievement:chosen.join("; "), reward:reward.value.trim() || null, platform:plat.value, username:"@" + u, note:note.value.trim() || null});
    btn.disabled = false;
    if (error) { msg.textContent = "Не получилось отправить. Попробуй позже."; return; }
    saveToks([...toks(), token]);
    try { localStorage.setItem("last", Date.now()); } catch {}
    [nick, un, note, reward].forEach(i => i.value = ""); pk.clear();
    msg.className = "msg good"; msg.textContent = "Заявка отправлена. С тобой свяжутся в выбранном мессенджере.";
    drawMine(mine);
  };
  const pubStats = h("div", {class:"stats gap"});
  db.rpc("public_stats").then(({ data: d }) => {
    if (!d) return;
    pubStats.replaceChildren(num("Заявок выполнено", d.closed), num("Сейчас в работе", d.open), num("Помощников", d.staff),
      num(d.reviews ? `Оценка сервиса, отзывов: ${d.reviews}` : "Оценка сервиса", d.avg || "—"));
  });
  box.append(h("h1", {}, "DorsoTic"), h("p", {class:"sub"}, "Помощь с достижениями в DOORS. Оставь заявку, и с тобой свяжется помощник."), pubStats,
    h("div", {class:"panel"},
      fld("Ник в Roblox", nick), h("div", {class:"lbl"}, "Какие достижения нужны (до 5)", pk.el),
      fld("Награда за помощь (по желанию). С наградой заявку берут быстрее", reward),
      h("div", {class:"row"}, fld("Где связаться", plat), fld("Юзернейм", un)),
      fld("Комментарий (по желанию)", note), site, btn, msg), mine);
  drawMine(mine);
}
function reviewForm(t, done) {
  let v = 0; const bs = [], pick = h("div", {class:"pick"});
  const paint = n => bs.forEach((x, j) => x.classList.toggle("on", j < n));
  for (let i = 1; i <= 5; i++) { const b = h("button", {type:"button", title:i + " из 5", "aria-label":i + " из 5", onclick:() => { v = i; paint(i); }}, "★"); bs.push(b); pick.append(b); }
  const cm = h("textarea", {maxlength:300, placeholder:"Комментарий (по желанию)"});
  const send = h("button", {onclick:async () => {
    if (!v) return toast("Выбери оценку от 1 до 5 звёзд.", 1);
    send.disabled = true;
    const { error } = await db.rpc("submit_review", {p_token:t, p_stars:v, p_comment:cm.value.trim() || null});
    if (error) { send.disabled = false; return toast(error.message, 1); }
    toast("Спасибо за отзыв!"); done();
  }}, "Отправить отзыв");
  return h("div", {class:"rv"}, h("div", {class:"meta"}, "Оцени помощь:"), pick, cm, h("div", {class:"acts"}, send));
}
async function drawMine(box) {
  const ts = toks();
  if (!ts.length) return box.replaceChildren();
  const res = await Promise.all(ts.map(t => db.rpc("request_status", {p_token:t}).then(r => ({t, error:r.error, s:r.data?.[0]}))));
  // Токены удалённых на сервере заявок убираем; при сетевой ошибке токен остаётся.
  const alive = res.filter(r => r.error || r.s).map(r => r.t);
  if (alive.length !== ts.length) saveToks(alive);
  const forget = t => { saveToks(toks().filter(x => x !== t)); drawMine(box); };
  const cards = res.filter(r => r.s).reverse().map(({t, s}) => {
    const c = h("div", {class:"card " + s.status}, h("b", {}, s.achievement.split("; ").join(" · ")),
      h("div", {class:"meta"}, h("span", {class:"pill " + s.status}, ST[s.status]), s.staff ? ` помощник: ${s.staff}` : ""));
    if (s.status === "new") c.append(h("div", {class:"acts"}, confirmBtn("Удалить заявку", "ghost", async b => {
      b.disabled = true;
      const { error } = await db.rpc("cancel_request", {p_token:t});
      if (error) { b.disabled = false; return toast(error.message, 1); }
      toast("Заявка удалена."); forget(t);
    })));
    if (s.status === "in_progress") c.append(h("div", {class:"meta"}, "Помощник уже взял заявку, поэтому удалить её нельзя. Напиши ему в мессенджер."));
    if (s.status === "closed") {
      c.append(s.reviewed ? h("div", {class:"meta"}, "Спасибо за отзыв!") : reviewForm(t, () => { drawMine(box); drawFoot(); }));
      c.append(h("div", {class:"acts"}, h("button", {class:"ghost", onclick:() => forget(t)}, "Убрать из списка")));
    }
    return c;
  });
  box.replaceChildren(...(cards.length ? [h("h2", {}, "Мои заявки"), ...cards] : []));
}

/* ---------- Как это работает ---------- */
function how(box) {
  const S = [["Выбери достижения", "Найди нужные в списке с поиском. В одной заявке можно выбрать до пяти."],
    ["Расскажи, как связаться", "Укажи Discord или Telegram и юзернейм. По желанию добавь награду: с ней заявку берут быстрее."],
    ["Помощник берёт заявку", "Статус меняется на «Выполняется», и помощник пишет тебе в мессенджер. Пока заявку никто не взял, её можно удалить."],
    ["Играете вместе", "Договоритесь о времени, зайдите в DOORS и выполните достижения."],
    ["Оцени помощь", "Когда заявка закрыта, поставь звёзды и оставь комментарий. Из оценок складывается рейтинг сервиса."]];
  const F = [["Нужен ли аккаунт?", "Нет. Посетителям достаточно ника в Roblox и юзернейма в Discord или Telegram."],
    ["Просят ли пароль от Roblox?", "Никогда. Если кто-то просит пароль, не отдавай его и сообщи владельцу."],
    ["Как удалить заявку?", "В блоке «Мои заявки» на главной нажми «Удалить заявку». Это можно сделать, пока заявку не взяли в работу."],
    ["Почему я не вижу заявку на другом устройстве?", "Статус хранится в браузере, где заявка была отправлена."]];
  box.append(h("h1", {}, "Как это работает"), h("p", {class:"sub"}, "Пять шагов от заявки до достижения."),
    h("ol", {class:"flow"}, S.map(([t, d]) => h("li", {}, h("div", {class:"card"}, h("b", {}, t), h("div", {class:"meta"}, d))))),
    h("h2", {}, "Частые вопросы"), ...F.map(([q, a]) => h("details", {}, h("summary", {}, q), h("p", {}, a))),
    h("div", {style:"text-align:center;margin-top:24px"}, h("button", {class:"go", onclick:() => go("home")}, "Оставить заявку")));
}

/* ---------- Вход ---------- */
function login(box) {
  const n = h("input", {autocomplete:"username", autocapitalize:"off"}), p = h("input", {type:"password", autocomplete:"current-password"});
  const msg = h("div", {class:"msg err", role:"status"});
  const b = h("button", {class:"go"}, "Войти");
  const submit = async () => {
    msg.textContent = ""; b.disabled = true;
    const { error } = await db.auth.signInWithPassword({email:n.value.trim().toLowerCase() + "@dorsotic.app", password:p.value});
    b.disabled = false;
    if (error) { msg.textContent = "Неверный ник или пароль."; return; }
    await loadMe();
    if (!me) { msg.textContent = "У этого аккаунта нет доступа."; return; }
    drawNav(); go("staff");
  };
  b.onclick = submit;
  [n, p].forEach(i => i.onkeydown = e => { if (e.key === "Enter") submit(); });
  box.append(h("h1", {}, "Вход для персонала"), h("p", {class:"sub"}, "Хочешь стать модератором или админом? Напиши владельцу в Telegram."),
    h("div", {class:"panel"}, fld("Ник", n), fld("Пароль", p), b, msg));
}

/* ---------- Панель персонала ---------- */
async function staffView(box) {
  if (!me) return go("login");
  const T = [["requests", "Заявки", tabRequests], ["profile", "Профиль", tabProfile]];
  if (me.role === "owner") T.push(["staff", "Персонал", tabStaff], ["log", "Журнал", tabLog], ["ach", "Ачивки", tabAch]);
  if (!T.some(t => t[0] === tab)) tab = "requests";
  const pane = h("div");
  const draw = async () => { newCtl(); const p = h("div", {class:"view"}); pane.replaceChildren(p); await T.find(t => t[0] === tab)[2](p); };
  const tabs = h("div", {class:"tabs top"}, T.map(([k, l]) => h("button", {type:"button", class:k === tab ? "on" : "", onclick:e => {
    if (k === tab) return;
    tab = k; [...tabs.children].forEach(b => b.classList.toggle("on", b === e.currentTarget)); draw();
  }}, l)));
  box.append(tabs, pane);
  drawFoot();
  await draw();
}
async function tabRequests(box) {
  const list = h("div", {class:"grid"}), chips = h("div", {class:"tabs"});
  let data = [], last = "";
  const btns = Object.keys(ST).map(k => {
    const b = h("button", {type:"button", class:k === rf ? "on" : "", onclick:() => { rf = k; btns.forEach(x => x.classList.toggle("on", x === b)); fill(); }}, ST[k]);
    b.dataset.k = k; return b;
  });
  chips.append(...btns, h("button", {type:"button", style:"margin-left:auto", onclick:() => load(true)}, "Обновить"));
  const act = async (fn, args, b) => {
    if (b) b.disabled = true;
    const { error } = await db.rpc(fn, args);
    if (error) { if (b) b.disabled = false; return toast(error.message, 1); }
    await load(true);
  };
  const transferUI = (c, r) => {
    const old = c.querySelector(".tr"); if (old) return old.remove();
    const sel = h("select", {"aria-label":"Кому передать"}, h("option", {value:""}, "В общую очередь"),
      Object.values(profiles).filter(p => p.id !== me.id).map(p => h("option", {value:p.id}, `${p.nickname} (${ROLE[p.role]})`)));
    const sendBtn = h("button", {type:"button", onclick:() => act("transfer_request", {p_id:r.id, p_to:sel.value || null}, sendBtn)}, "Передать");
    c.append(h("div", {class:"tr"}, sel, sendBtn));
  };
  const card = r => {
    const mine = r.taken_by === me.id, can = mine || me.role !== "moderator";
    const owner = r.taken_by && profiles[r.taken_by] ? profiles[r.taken_by].nickname + " · " : "";
    const c = h("div", {class:"card " + r.status},
      h("b", {}, r.achievement.split("; ").join(" · ")),
      h("div", {}, `${r.nickname} · ${PL[r.platform]} ${r.username}`),
      r.reward ? h("div", {class:"gift"}, "Награда: " + r.reward) : null,
      r.note ? h("div", {}, r.note) : null,
      h("div", {class:"meta"}, h("span", {class:"pill " + r.status}, ST[r.status]), " ", owner + fmt(r.created_at)));
    const a = h("div", {class:"acts"});
    if (r.status === "new") a.append(h("button", {type:"button", onclick:e => act("start_request", {p_id:r.id}, e.currentTarget)}, "Взять в работу"));
    if (r.status === "in_progress" && can) a.append(
      h("button", {type:"button", onclick:e => act("close_request", {p_id:r.id}, e.currentTarget)}, "Закрыть"),
      h("button", {type:"button", class:"ghost", title:"Вернуть заявку в очередь, если не получается выполнить", onclick:e => act("transfer_request", {p_id:r.id, p_to:null}, e.currentTarget)}, "Вернуть в новые"),
      h("button", {type:"button", class:"ghost", onclick:() => transferUI(c, r)}, "Передать"));
    if (can) a.append(confirmBtn("Удалить", "ghost", b => act("delete_request", {p_id:r.id}, b)));
    if (a.children.length) c.append(a);
    return c;
  };
  const fill = () => {
    btns.forEach(b => b.textContent = `${ST[b.dataset.k]} (${data.filter(r => r.status === b.dataset.k).length})`);
    const rows = data.filter(r => r.status === rf).sort((a, b) => !!b.reward - !!a.reward);
    list.replaceChildren(...(rows.length ? rows.map(card) : [h("p", {class:"empty"}, "Здесь пока пусто.")]));
  };
  const sig = d => d.map(r => r.id + r.status + (r.taken_by || "")).join("|");
  const load = async manual => {
    if (!manual && list.querySelector(".tr")) return;
    const { data: d, error } = await db.from("requests").select("*").order("created_at", {ascending:false}).limit(200);
    if (error) { if (manual) toast("Не удалось загрузить заявки.", 1); return; }
    const n = d.filter(r => r.status === "new").length;
    if (lastNew !== null && n > lastNew) toast("Новая заявка!");
    lastNew = n; document.title = (n ? `(${n}) ` : "") + "DorsoTic";
    const s = sig(d);
    if (!manual && s === last) return;
    last = s; data = d; fill();
  };
  box.append(chips, list);
  await load(true);
  timer = setInterval(() => { if (!document.hidden) load(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); }, {signal:vc.signal});
}
async function tabProfile(box) {
  let uid = me.id;
  const out = h("div");
  const draw = async () => {
    const [{ data: s }, { data: rv }] = await Promise.all([db.rpc("staff_stats", {p_uid:uid}), db.from("reviews").select("stars,comment,created_at").eq("staff_id", uid).order("created_at", {ascending:false}).limit(10)]);
    if (!s) return out.replaceChildren(h("p", {class:"empty"}, "Не удалось загрузить статистику."));
    out.replaceChildren(h("h2", {}, "Закрытых заявок"), h("div", {class:"stats"}, [["Сегодня", s.day], ["Неделя", s.week], ["Месяц", s.month], ["Всё время", s.total]].map(([l, n]) => num(l, n))),
      h("h2", {}, "Отзывы"), s.avg ? h("div", {}, stars(s.avg), ` ${s.avg} из 5 · всего: ${s.reviews}`) : h("p", {class:"empty"}, "Отзывов пока нет."),
      ...(rv || []).map(r => h("div", {class:"card closed"}, stars(r.stars), r.comment ? h("div", {}, r.comment) : null, h("div", {class:"meta"}, fmt(r.created_at)))));
  };
  if (me.role === "owner") {
    const sel = h("select", {onchange:e => { uid = e.target.value; draw(); }}, Object.values(profiles).map(p => h("option", {value:p.id}, `${p.nickname} · ${ROLE[p.role]}`)));
    sel.value = me.id; box.append(fld("Сотрудник", sel));

  box.append(out); await draw();
}
async function tabStaff(box) {
  const n = h("input", {placeholder:"ник: a-z, 0-9, _", autocapitalize:"off"}), p = h("input", {placeholder:"пароль от 8 символов", autocomplete:"new-password"});

async function tabLog(box) {

  const L = {start:"начал(а) работу", close:"закрыл(а)", delete:"удалил(а)", cancel:"удалил(а) заявку", transfer:"передал(а) заявку"};

async function tabAch(box) {
  const ta = h("textarea", {placeholder:"По одному достижению в строке", style:"min-height:140px"});
  const list = h("div");
  const load = async () => {
    const { data } = await db.from("achievements").select("*").order("name");
    list.replaceChildren(h("h2", {}, `Список достижений (${data?.length || 0})`), ...(data || []).map(a => h("div", {class:"card closed", style:"display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 12px"},
      h("span", {}, a.name), h("button", {class:"ghost", "aria-label":"Удалить " + a.name, onclick:async () => {
        const { error } = await db.from("achievements").delete().eq("id", a.id);
        if (error) return toast("Не удалось удалить.", 1);
        load();
      }}, "×"))));
  };
  const add = async rows => {
    if (!rows.length) return false;
    const { error } = await db.from("achievements").upsert(rows, {onConflict:"name", ignoreDuplicates:true});
    if (error) { toast("Не удалось добавить.", 1); return false; }
    load(); return true;
  };
  const preset = h("button", {type:"button", class:"ghost preset", onclick:async () => {
    preset.disabled = true;
    if (await add(Object.keys(CAT).map(name => ({name})))) toast(`Готовый список загружен: ${Object.keys(CAT).length}`);
    preset.disabled = false;
  }}, `Загрузить готовый список (${Object.keys(CAT).length})`);
  box.append(h("div", {class:"panel"}, fld("Добавить достижения", ta), h("button", {class:"go", onclick:async () => {
    const rows = [...new Set(ta.value.split("\n").map(s => s.trim()).filter(Boolean))].map(name => ({name}));
    if (await add(rows)) { ta.value = ""; toast("Добавлено."); }
  }}, "Добавить"), h("div", {}, preset)), list);
  load();
}
