/* Compact, app-like phone layout: more room for content and smaller controls */
@media(max-width:600px){
 html{font-size:14px}header{padding:calc(.42rem + env(safe-area-inset-top)) .7rem .42rem}.logo{font-size:1.35rem}.head-tools{gap:.35rem}.bg-trigger{font-size:.7rem;min-height:1.8rem;padding:.22rem .5rem}.rate{font-size:.68rem;padding:.12rem .45rem;max-width:6.5rem;overflow:hidden;text-overflow:ellipsis}
 main{padding:.9rem .65rem 5.1rem;max-width:100%}main.wide{max-width:100%}h1{font-size:1.65rem;margin-bottom:.3rem}h2{font-size:1.12rem;margin:1rem 0 .5rem}.sub{font-size:.83rem;margin-bottom:.75rem}
 .door,.mdl{padding:.78rem;border-radius:.8rem}.door label,.lbl{margin-top:.5rem;font-size:.77rem}input,textarea,select{padding:.42rem .55rem;font-size:16px;margin-top:.2rem;border-radius:.55rem}textarea{min-height:3.3rem}.row{grid-template-columns:1fr;gap:.25rem}
 button{min-height:1.95rem;padding:.32rem .62rem;font-size:.8rem;border-radius:.55rem}.go{width:100%;margin-top:.65rem;padding:.4rem .8rem;font-size:.9rem}.tabs{gap:.28rem;margin-bottom:.5rem}.tabs button{min-height:1.8rem;padding:.27rem .5rem;font-size:.74rem}.acts{gap:.3rem;margin-top:.4rem}.acts button{flex:0 1 auto;padding:.27rem .48rem;font-size:.73rem;min-height:1.8rem}.grid{grid-template-columns:1fr;gap:.4rem}.card{padding:.55rem .62rem;margin-bottom:.4rem}.grid .card{padding:.62rem}.meta{font-size:.73rem}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:.35rem;margin-bottom:.6rem}.stat{padding:.4rem .55rem;font-size:.72rem}.stat span{font-size:1.35rem}.pk-list{max-height:10.5rem}.pk-i{padding:.42rem .55rem;font-size:.84rem}.tag{font-size:.72rem}footer{padding:.6rem .7rem 4.7rem;font-size:.72rem}
 nav{width:calc(100% - .7rem);bottom:calc(.35rem + env(safe-area-inset-bottom));gap:.05rem;padding:.18rem;border-radius:.85rem}nav button{min-width:0;flex:1;padding:.25rem .12rem;min-height:2.25rem;font-size:.63rem;border-radius:.55rem}nav button span:first-child{font-size:.9rem}.toast{bottom:4.6rem;font-size:.8rem;padding:.42rem .7rem}
}
@media(min-width:800px){main{padding-top:1.8rem}.door{padding:1.25rem}.grid{gap:.7rem}}
@media(prefers-reduced-motion:reduce){#app>* ,.logo,.card{animation:none!important;transition:none!important}}


/* Более заметное подтверждение отправки заявки */
.bd{background:rgba(0,0,0,.88);backdrop-filter:blur(10px);padding:1rem;animation:modalFade .18s ease both}
.mdl{position:relative;width:min(29rem,100%);border:1px solid rgba(213,173,104,.48);box-shadow:0 24px 90px rgba(0,0,0,.8),0 0 0 1px rgba(213,173,104,.08);animation:modalPop .22s cubic-bezier(.2,.8,.2,1) both}
.mdl-warning{border:2px solid #d5ad68;background:linear-gradient(145deg,rgba(49,34,21,.99),rgba(18,12,9,.99));padding:1.25rem;box-shadow:0 24px 90px rgba(0,0,0,.85),0 0 36px rgba(213,173,104,.17)}
.mdl-warning h2{font-size:1.45rem;color:#f1ce8a;margin:.2rem 0 .25rem;text-align:center}
.mdl-warning p{color:#f0e1c9;line-height:1.6;background:rgba(213,173,104,.08);border:1px solid rgba(213,173,104,.25);border-radius:.7rem;padding:.8rem;margin:.8rem 0 1rem}
.warning-mark{display:grid;place-items:center;width:2.5rem;height:2.5rem;margin:0 auto .5rem;border-radius:50%;font:bold 1.5rem/1 Georgia,serif;color:#20150b;background:#e0b96f;box-shadow:0 0 24px rgba(213,173,104,.2)}
.warning-caption{text-align:center;text-transform:uppercase;letter-spacing:.16em;font-size:.68rem;color:#c9a66c}
.mdl-warning .acts{gap:.55rem;margin-top:1rem}.mdl-warning .acts button{flex:1;min-height:2.7rem}.mdl-warning .acts button:last-child{background:linear-gradient(135deg,#e4c17b,#b18a4d);color:#21160a}
.reward-field{margin-top:.7rem;padding:.65rem .75rem .7rem;border:1px solid rgba(213,173,104,.32);border-radius:.75rem;background:rgba(213,173,104,.055)}
.reward-field label{margin-top:0;color:#ead1a4;font-size:.88rem;font-weight:700}.reward-field input{margin-top:.4rem}
.reward-hint{margin-top:.4rem;color:#d4b984;font-size:.78rem;line-height:1.4}
@keyframes modalFade{from{opacity:0}to{opacity:1}}@keyframes modalPop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:600px){.mdl-warning{padding:1rem}.mdl-warning h2{font-size:1.25rem}.mdl-warning .acts button{min-height:2.45rem}}

</style>
</head>
<body>
<header><div class="logo" id="logo">DorsoTic</div><div class="head-tools"><div class="rate" id="rate"></div></div></header>
<main id="app"></main>
<footer><div id="fr"></div><div id="fl"></div>
<div class="meta" style="max-width:34rem;margin:.6rem auto 0">Неофициальный сервис. Не связан с Roblox Corporation и Lightning Bolt Studios (DOORS). Мы храним ник Roblox, юзернейм мессенджера и текст заявки только для её выполнения; через 30 дней после закрытия заявка обезличивается.</div></footer>
<nav id="nav" aria-label="Меню"></nav>
<noscript><p style="text-align:center;padding:2rem">Для работы сайта нужен JavaScript.</p></noscript>
<script src="app.js"></script>

</body>
</html>
