  const chips = h("div", {class:"fchips"}, [["", "Все"], ["e", "Лёгкие"], ["m", "Средние"], ["h", "Сложные"]].map(([k, l]) => {
    const b = h("button", {type:"button", class:k === df ? "on" : "", onclick:() => { df = k; [...chips.children].forEach(x => x.classList.toggle("on", x === b)); draw(); }}, l); return b; }));
  panel.insertBefore(chips, ul);
  const el = h("div", {class:"pk"}, btn, panel, tags);
  const refresh = () => {
    btn.textContent = sel.length ? `Выбрано: ${sel.length} из ${max}` : "Выбери достижения";
    tags.replaceChildren(...sel.map(n => h("span", {class:"tag"}, n, h("button", {type:"button", class:"ghost", "aria-label":"Убрать", onclick:() => toggle(n)}, "×"))));
    draw();
  };
  const toggle = n => {
    const i = sel.indexOf(n);
    if (i >= 0) sel.splice(i, 1); else if (sel.length < max) sel.push(n); else return toast(`Не больше ${max} достижений в одной заявке`, 1);
    refresh();
  };
  const draw = () => {
    const s = q.value.trim().toLowerCase(), m = items.filter(n => (!df || CAT[n]?.[0] === df) && (n.toLowerCase().includes(s) || (CAT[n]?.[1] || "").toLowerCase().includes(s)));
    ul.replaceChildren(...(m.length ? m.map(n => h("div", {class:"pk-i" + (sel.includes(n) ? " on" : ""), role:"option", tabindex:"0", onclick:() => toggle(n), onkeydown:e => { if (e.key === "Enter") toggle(n); }}, h("div", {class:"t"}, h("span", {}, (sel.includes(n) ? "✓ " : "") + n), CAT[n] ? h("span", {class:"dif " + CAT[n][0]}, DIF[CAT[n][0]]) : null), CAT[n] ? h("small", {}, CAT[n][1]) : null))
      : [h("div", {class:"pk-i empty"}, items.length ? "Ничего не найдено" : "Список достижений пока пуст")]));
  };
  btn.onclick = () => { panel.hidden = !panel.hidden; if (!panel.hidden) { q.value = ""; draw(); q.focus(); } };
  q.oninput = draw;
  document.addEventListener("click", e => { if (!el.contains(e.target)) panel.hidden = true; });
  return {el, get:() => [...sel], clear:() => { sel.length = 0; refresh(); }};
}

/* ---------- Главная ---------- */
async function home(box) {
  const { data: list } = await db.from("achievements").select("name").order("name");
  const names = new Set((list || []).map(a => a.name));
  const nick = h("input", {maxlength:40, placeholder:"Ник в Roblox"});
  const pk = picker((list || []).map(a => a.name));
  const plat = h("select", {}, h("option", {value:"discord"}, "Discord"), h("option", {value:"telegram"}, "Telegram"));
  const un = h("input", {maxlength:40, placeholder:"@username"});
  const note = h("textarea", {maxlength:300});
  const reward = h("input", {maxlength:100, placeholder:"Например: предмет, ключ, золото"});
  const site = h("input", {class:"hp", tabindex:"-1", autocomplete:"off", "aria-hidden":"true"});
  const msg = h("div", {class:"msg", role:"status"});
  const mine = h("div");
  const btn = h("button", {class:"go"}, "Отправить заявку");
  btn.onclick = async () => {
    msg.className = "msg err";
    if (site.value) return;
    const u = un.value.trim().replace(/^@/, "");
    const chosen = pk.get();
    if (!nick.value.trim() || !chosen.length || !chosen.every(n => names.has(n))) { msg.textContent = "Укажи ник и выбери хотя бы одно достижение."; return; }
    if (!/^[A-Za-z0-9_.]{2,32}$/.test(u)) { msg.textContent = "Юзернейм: буквы, цифры, _ и точка, например @DorsoNews."; return; }
    if (Date.now() - (+localStorage.getItem("last") || 0) < 60000) { msg.textContent = "Подожди минуту перед следующей заявкой."; return; }
    btn.disabled = true;
    const token = crypto.randomUUID();
    const { error } = await db.from("requests").insert({token, nickname:nick.value.trim(), achievement:chosen.join("; "), reward:reward.value.trim() || null, platform:plat.value, username:"@" + u, note:note.value.trim() || null});
    btn.disabled = false;
    if (error) { msg.textContent = "Не получилось отправить. Попробуй позже."; return; }
    saveToks([...toks(), token]);
    try { localStorage.setItem("last", Date.now()); } catch {}
    [nick, un, note, reward].forEach(i => i.value = ""); pk.clear();
    msg.className = "msg good"; msg.textContent = "Заявка отправлена. С тобой свяжутся в выбранном мессенджере.";
    drawMine(mine);
  };
  const pubStats = h("div", {class:"stats", style:"margin-bottom:12px"});
  db.rpc("public_stats").then(({ data: d }) => {
    if (!d) return;
    const num = (l, n) => { const sp = h("span", {}, "0"); count(sp, n); return h("div", {class:"stat"}, sp, l); };
    pubStats.replaceChildren(num("Заявок выполнено", d.closed), num("Сейчас в работе", d.open), num("Помощников", d.staff),
      h("div", {class:"stat"}, h("span", {}, d.avg ? String(d.avg) : "—"), d.reviews ? `Оценка сервиса, отзывов: ${d.reviews}` : "Оценка сервиса"));
  });
  box.append(h("h1", {}, "DorsoTic"), h("p", {class:"sub"}, "Помощь с достижениями в DOORS. Оставь заявку, и с тобой свяжется помощник."), pubStats,
    h("div", {class:"door"},
      fld("Ник в Roblox", nick), h("div", {class:"lbl"}, "Какие достижения нужны (до 5)", pk.el),
      fld("Награда за помощь (по желанию). С наградой заявку берут быстрее", reward),
      h("div", {class:"row"}, fld("Где связаться", plat), fld("Юзернейм", un)),
      fld("Комментарий (по желанию)", note), site, btn, msg), mine);
  drawMine(mine);
}
function reviewForm(t, done) {
  let v = 0; const bs = [], pick = h("div", {class:"pick"});
  const paint = n => bs.forEach((x, j) => x.classList.toggle("on", j < n));
  for (let i = 1; i <= 5; i++) { const b = h("button", {type:"button", title:i + " из 5", onmouseover:() => paint(i), onclick:() => { v = i; paint(i); }}, "★"); bs.push(b); pick.append(b); }
  pick.onmouseleave = () => paint(v);
  const cm = h("textarea", {maxlength:300, placeholder:"Комментарий (по желанию)"});
  const send = h("button", {onclick:async () => {
    if (!v) return toast("Выбери оценку от 1 до 5 звёзд.", 1);
    const { error } = await db.rpc("submit_review", {p_token:t, p_stars:v, p_comment:cm.value.trim() || null});
    if (error) return toast(error.message, 1);
    toast("Спасибо за отзыв!"); done();
  }}, "Отправить отзыв");
  return h("div", {class:"rv"}, h("div", {class:"meta"}, "Оцени помощь:"), pick, cm, h("div", {class:"acts"}, send));
}
async function drawMine(box) {
  const items = [];
  for (const t of toks()) {
    const { data } = await db.rpc("request_status", {p_token:t});
    const s = data?.[0]; if (!s) continue;
    const c = h("div", {class:"card " + s.status}, h("b", {}, s.achievement.split("; ").join(" · ")),
      h("div", {class:"meta"}, h("span", {class:"pill " + s.status}, ST[s.status]), s.staff ? ` помощник: ${s.staff}` : ""));
    if (s.status === "new") c.append(h("div", {class:"acts"}, h("button", {class:"ghost", onclick:async () => {
      if (!confirm("Отозвать заявку?")) return;
      const { error } = await db.rpc("cancel_request", {p_token:t});
      if (error) return toast(error.message, 1);
      saveToks(toks().filter(x => x !== t)); toast("Заявка отозвана."); drawMine(box);
    }}, "Отозвать заявку")));
    if (s.status === "closed") c.append(s.reviewed ? h("div", {class:"meta"}, "Спасибо за отзыв!") : reviewForm(t, () => { drawMine(box); drawFoot(); }));
    items.push(c);
  }
  box.replaceChildren(...(items.length ? [h("h2", {}, "Мои заявки"), ...items] : []));
}

/* ---------- Как это работает ---------- */
function how(box) {
  const S = [["Выбери достижения", "Найди нужные в списке с поиском. В одной заявке можно выбрать до пяти."],
    ["Расскажи, как связаться", "Укажи Discord или Telegram и юзернейм. По желанию добавь награду: с ней заявку берут быстрее."],
    ["Помощник берёт заявку", "Статус меняется на «Выполняется», и помощник пишет тебе в мессенджер. Пока заявку никто не взял, её можно отозвать."],
    ["Играете вместе", "Договоритесь о времени, зайдите в DOORS и выполните достижения."],
    ["Оцени помощь", "Когда заявка закрыта, поставь звёзды и оставь комментарий. Из оценок складывается рейтинг сервиса."]];
  const F = [["Нужен ли аккаунт?", "Нет. Посетителям достаточно ника в Roblox и юзернейма в Discord или Telegram."],
    ["Просят ли пароль от Roblox?", "Никогда. Если кто-то просит пароль, не отдавай его и сообщи владельцу."],
    ["Как отозвать заявку?", "В блоке «Мои заявки» на главной нажми «Отозвать». Это можно сделать, пока заявку не взяли в работу."],
    ["Почему я не вижу заявку на другом устройстве?", "Статус хранится в браузере, где заявка была отправлена."]];
  const flow = h("div", {class:"flow"}, h("div", {class:"line"}), S.map(([t, d], i) =>
    h("div", {class:"step", style:`--i:${i}`}, h("div", {class:"n"}, String(i + 1)), h("div", {class:"card"}, h("b", {}, t), h("div", {class:"meta"}, d)))));
  box.append(h("h1", {}, "Как это работает"), h("p", {class:"sub"}, "Пять шагов от заявки до достижения."), flow,
    h("h2", {}, "Частые вопросы"), ...F.map(([q, a]) => h("details", {}, h("summary", {}, q), h("p", {}, a))),
    h("div", {style:"text-align:center;margin-top:16px"}, h("button", {class:"go", onclick:() => go("home")}, "Оставить заявку")));
  const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { flow.classList.add("in"); io.disconnect(); } }, {threshold:.15});
  io.observe(flow);
}

/* ---------- Вход ---------- */
function login(box) {
  const n = h("input", {autocomplete:"username"}), p = h("input", {type:"password", autocomplete:"current-password"});
  const msg = h("div", {class:"msg err"});
  const submit = async () => {
    msg.textContent = "";
    const { error } = await db.auth.signInWithPassword({email:n.value.trim().toLowerCase() + "@dorsotic.app", password:p.value});
    if (error) { msg.textContent = "Неверный ник или пароль."; return; }
    await loadMe();
    if (!me) { msg.textContent = "У этого аккаунта нет доступа."; return; }
    drawNav(); go("staff");
  };
  p.onkeydown = e => { if (e.key === "Enter") submit(); };
  box.append(h("h1", {}, "Вход для персонала"), h("p", {class:"sub"}, "Хочешь стать модератором или админом? Напиши владельцу в Telegram."),
    h("div", {class:"door"}, fld("Ник", n), fld("Пароль", p), h("button", {class:"go", onclick:submit}, "Войти"), msg));
}

/* ---------- Панель персонала ---------- */
async function staffView(box) {
  if (!me) return go("login");
  const T = [["requests", "Заявки", tabRequests], ["profile", "Профиль", tabProfile]];
  if (me.role === "owner") T.push(["staff", "Персонал", tabStaff], ["log", "Журнал", tabLog], ["ach", "Ачивки", tabAch]);
  if (!T.some(t => t[0] === tab)) tab = "requests";
  const pane = h("div");
  const draw = async () => { clearInterval(timer); const p = h("div", {class:"view"}); pane.replaceChildren(p); await T.find(t => t[0] === tab)[2](p); };
  const tabs = h("div", {class:"tabs top"}, T.map(([k, l]) => h("button", {class:k === tab ? "on" : "", onclick:e => {
    tab = k; [...tabs.children].forEach(b => b.classList.remove("on")); e.currentTarget.classList.add("on"); draw();
  }}, l)));
  box.append(tabs, pane);
  await draw();
}
async function tabRequests(box) {
  const list = h("div", {class:"grid"}), chips = h("div", {class:"tabs"});
  let data = [], first = true;
  const btns = Object.keys(ST).map(k => { const b = h("button", {class:k === rf ? "on" : "", onclick:() => { rf = k; btns.forEach(x => x.classList.toggle("on", x === b)); first = true; fill(); }}, ST[k]); b.dataset.k = k; return b; });
  chips.append(...btns, h("button", {class:"ghost", style:"margin-left:auto", onclick:() => load(true)}, "Обновить"));
  const act = async (fn, args, c) => {
    const { error } = await db.rpc(fn, args);
    if (error) return toast(error.message, 1);
    if (fn === "delete_request") { c.classList.add("out"); await sleep(260); }
    load(true);
  };
  const transferUI = (c, r) => {
    const old = c.querySelector(".tr"); if (old) return old.remove();
    const sel = h("select", {}, h("option", {value:""}, "В общую очередь"), Object.values(profiles).filter(p => p.id !== me.id).map(p => h("option", {value:p.id}, `${p.nickname} (${ROLE[p.role]})`)));
    c.append(h("div", {class:"tr"}, sel, h("button", {onclick:() => act("transfer_request", {p_id:r.id, p_to:sel.value || null}, c)}, "Передать")));
  };
  const card = (r, i) => {
    const can = r.taken_by === me.id || me.role !== "moderator";
    const c = h("div", {class:"card " + r.status, style:`--i:${Math.min(i, 12)}`},
      h("b", {}, r.achievement.split("; ").join(" · ")),
      h("div", {}, `${r.nickname} · ${PL[r.platform]} ${r.username}`),
      r.reward ? h("div", {class:"gift"}, "Награда: " + r.reward) : null,
      r.note ? h("div", {}, r.note) : null,
      h("div", {class:"meta"}, h("span", {class:"pill " + r.status}, ST[r.status]), `${r.taken_by && profiles[r.taken_by] ? " " + profiles[r.taken_by].nickname + " ·" : ""} ${fmt(r.created_at)}`));
    const a = h("div", {class:"acts"});
    if (r.status === "new") a.append(h("button", {onclick:() => act("start_request", {p_id:r.id}, c)}, "Начать работу"));
    if (r.status === "in_progress" && can) a.append(h("button", {onclick:() => act("close_request", {p_id:r.id}, c)}, "Закрыть заявку"), h("button", {class:"ghost", onclick:() => transferUI(c, r)}, "Передать"));
    a.append(h("button", {class:"bad", onclick:() => confirm("Удалить заявку?") && act("delete_request", {p_id:r.id}, c)}, "Удалить"));
    c.append(a); return c;
  };
  const fill = () => {
    btns.forEach(b => b.textContent = `${ST[b.dataset.k]} (${data.filter(r => r.status === b.dataset.k).length})`);
    const rows = data.filter(r => r.status === rf).sort((a, b) => !!b.reward - !!a.reward);
    list.classList.toggle("still", !first);
    list.replaceChildren(...(rows.length ? rows.map(card) : [h("p", {class:"empty"}, "Здесь пока пусто.")]));
    first = false;
  };
  const load = async manual => {
    if (!manual && list.querySelector(".tr")) return;
    const { data: d, error } = await db.from("requests").select("*").order("created_at", {ascending:false}).limit(200);
    if (error) { if (manual) toast("Не удалось загрузить заявки.", 1); return; }
    const n = d.filter(r => r.status === "new").length;
    if (lastNew !== null && n > lastNew) toast("Новая заявка!");
    lastNew = n; document.title = (n ? `(${n}) ` : "") + "DorsoTic";
    data = d; if (manual) first = true; fill();
  };
  box.append(chips, list);
  await load(true);
  timer = setInterval(() => load(), 15000);
}
async function tabProfile(box) {

    const cells = [["Сегодня", s.day], ["Неделя", s.week], ["Месяц", s.month], ["Всё время", s.total]].map(([l, n]) => { const sp = h("span", {}, "0"); count(sp, n); return h("div", {class:"stat"}, sp, l); });
    out.replaceChildren(h("h2", {}, "Аналитика: закрытых заявок"), h("div", {class:"stats"}, cells),
      h("h2", {}, "Отзывы"), s.avg ? h("div", {}, stars(s.avg), ` ${s.avg} из 5 · всего: ${s.reviews}`) : h("p", {class:"empty"}, "Отзывов пока нет."),
      ...(rv || []).map(r => h("div", {class:"card closed"}, stars(r.stars), r.comment ? h("div", {}, r.comment) : null, h("div", {class:"meta"}, fmt(r.created_at)))));

async function tabLog(box) {
