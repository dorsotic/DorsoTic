/* DorsoTic 2.0 — DOORS-inspired crimson interface; presentation only */
:root{
  --bg:#09090c;--p:#111116;--p2:#19191f;--line:#383039;
  --text:#f4f0f2;--mute:#b6aab2;--brass:#e04452;
  --ok:#91c99b;--wait:#ff737e;--hold:#b0a0c8;--r:.8rem;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse at 50% -12%,rgba(224,48,67,.19),transparent 48%),

    var(--bg);
  background-attachment:fixed;
}
header{
  background:rgba(9,9,12,.88);border-bottom-color:rgba(224,68,82,.28);

}
.logo{color:#ff6570;text-shadow:0 0 22px rgba(224,68,82,.25);letter-spacing:.08em}

h1{color:#ff6570;text-shadow:0 0 24px rgba(224,68,82,.14)}

.door,.mdl{
  background:linear-gradient(145deg,rgba(29,27,34,.97),rgba(15,15,20,.98));

  box-shadow:0 14px 40px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.025);
}
label,.lbl{color:#c0b1ba}
input,textarea,select{
  background:rgba(5,5,8,.72);border-color:#41343d;border-radius:.7rem;color:var(--text);
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
input:focus,textarea:focus,select:focus{
  border-color:#e04452;box-shadow:0 0 0 3px rgba(224,68,82,.18);background:#0c0b10;
}
button{
  background:linear-gradient(135deg,#f04b5b,#b91f35);color:#fff;border:1px solid rgba(255,154,164,.22);
  border-radius:.7rem;box-shadow:0 3px 12px rgba(155,19,39,.15);
  transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;
}
button:hover{filter:brightness(1.12);box-shadow:0 5px 18px rgba(224,40,62,.2)}
button:active{transform:translateY(1px)}
button:disabled{box-shadow:none}
button.ghost{background:rgba(255,255,255,.025);color:#eee4e9;border-color:#493640;box-shadow:none}

button.bad{background:#8f1d2e;color:#fff;border-color:#c33b4d}

.go{font-size:1.08rem;letter-spacing:.04em}
.msg.err,.err,.warn{color:#ff7c86}.good{color:#9bd6a5}
.tabs button{background:rgba(255,255,255,.025);color:#bcaeb7;border-color:#41313a}
.tabs button.on,nav button.cur{background:rgba(224,68,82,.15);color:#ff7782;border-color:rgba(224,68,82,.62)}
nav{
  background:rgba(16,15,21,.94);border-color:#4a303b;border-radius:1.2rem;
  box-shadow:0 12px 38px rgba(0,0,0,.6),0 0 22px rgba(160,24,43,.08);backdrop-filter:blur(16px);
}

nav button.cur{box-shadow:inset 0 0 18px rgba(224,68,82,.06)}
.card{
  background:linear-gradient(145deg,rgba(28,26,33,.97),rgba(16,16,21,.98));
  border-color:#39313b;border-left-color:#51404b;border-radius:.85rem;padding:.75rem .85rem;
  box-shadow:0 6px 20px rgba(0,0,0,.12);transition:border-color .18s ease,transform .18s ease;
}
.grid .card:hover{border-top-color:#5b3a46}
.card.new{border-left-color:#ff6570}.card.in_progress{border-left-color:#e04452}.card.waiting{border-left-color:#a994c2}.card.closed{border-left-color:#79b986}
.meta{color:#b5a7b1}
.pill{color:#171116;background:#c5b5bf}.pill.new{background:#ff7a83;color:#260b10}.pill.in_progress{background:#ed4a5a;color:white}.pill.waiting{background:#b6a2cd;color:#21162a}.pill.closed{background:#91c99b;color:#102316}
.stat{background:linear-gradient(145deg,#1b1a21,#111116);border-color:#3d303a;border-radius:.85rem}
.stat span{color:#ff6570}
.stars{background:linear-gradient(90deg,#ff6570 var(--v,0%),#493740 var(--v,0%));-webkit-background-clip:text;background-clip:text}
.pick button{background:transparent;color:#51404b;box-shadow:none;border:0}.pick button.on{color:#ff6570}
.pk-list{border-color:#41313a;border-radius:.75rem;background:rgba(0,0,0,.18)}
.pk-i{border-bottom-color:rgba(80,55,67,.42)}.pk-i:hover,.pk-i:focus{background:rgba(224,68,82,.12)}.pk-i.on{color:#ff7782}
.tag{background:rgba(224,68,82,.1);border-color:#c53b4c;color:#ffdce0}
.gift{background:rgba(90,170,112,.1);border-color:#579b68;color:#a5ddb0}
.note{color:#c3add9}
details{background:rgba(21,20,26,.92);border-color:#3d303a;border-radius:.8rem}
summary{color:#f0e6eb}details p{color:#b9aab4}
footer{border-top-color:#352832;background:rgba(5,5,8,.45);color:#b5a7b1}
.lk{color:#ff828b}
.toast{background:#19171e;border-color:#d94a59;box-shadow:0 8px 32px rgba(0,0,0,.45)}.toast.bad{border-color:#ff7c86}
.bd{background:rgba(3,3,6,.78);backdrop-filter:blur(5px)}
.mdl{border-radius:1.1rem}
:focus-visible{outline-color:#ff8a93}
